model_list:
  # --- Gemma 4 31B (free) orchestration via a separate OpenRouter credential ---
  # - model_name: "gemma-4-31b-free"
  #   litellm_params:
  #     model: openrouter/google/gemma-4-31b-it:free
  #     api_key: os.environ/FALL_BACK_OPEN_ROUTER_API_KEY
  # Gemini route removed; legacy alias disabled. Set AGENT_MODEL_ID=gemma-4-31b-free.
  - model_name: "gemini-3.1-flash-lite"
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # --- OpenRouter BGE-M3 Embedding Model ---
  - model_name: "text-embedding-default"
    litellm_params:
      model: openrouter/baai/bge-m3
      api_key: os.environ/OPEN_ROUTER_API_KEY
    model_info:
      mode: embedding
      supported_endpoints: ["/v1/embeddings"]

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120

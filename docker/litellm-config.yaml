model_list:
  # --- Google AI Studio (Gemini) Chat Models ---
  - model_name: "gemini-2.5-flash"
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: "gemini-2.5-pro"
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # --- Google AI Studio (Gemini) Embedding Model (768 dimensions) ---
  - model_name: "text-embedding-default"
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      dimensions: 768

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 2
  request_timeout: 120
